<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Abstract agent/network mark: a central node with three orbiting nodes,
       standing in for the multi-agent architecture (research/write/engage)
       rather than any third-party platform's logo. -->
  <g fill="none" stroke="#f8fafc" stroke-width="34" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="308"/>
    <line x1="512" y1="512" x2="345" y2="618"/>
    <line x1="512" y1="512" x2="679" y2="618"/>
  </g>
  <circle cx="512" cy="512" r="92" fill="#f8fafc"/>
  <circle cx="512" cy="308" r="62" fill="#93c5fd"/>
  <circle cx="345" cy="618" r="62" fill="#93c5fd"/>
  <circle cx="679" cy="618" r="62" fill="#93c5fd"/>
  <circle cx="512" cy="512" r="40" fill="#1d4ed8"/>
</svg>
