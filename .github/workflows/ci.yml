name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Static checks
        run: |
          ruff check backend
          mypy backend/app --ignore-missing-imports
      - name: Tests and safety audit
        env:
          CREDENTIAL_ENCRYPTION_KEY: "TTnYEol6gSAAV6xIIUrsEtNVJw7m7yTAZCICTaiQHC8="
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest backend/tests backend/evals --cov=backend/app --cov=backend/evals --cov-fail-under=80
          PYTHONPATH=backend python -m app.tools.registry --validate-all-schemas
          PYTHONPATH=backend python -m app.safety.audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  # Validates native Tauri compilation on all three target OSes (a clean
  # machine each run, unlike this repo's own dev workstation, which is
  # missing the Linux WebKitGTK/GLib dev headers — see
  # docs/desktop-migration-audit.md). This is a compile/packaging-validation
  # job only: it never signs, notarizes, tags, or publishes anything (see
  # docs/releasing.md — that remains manual and gated on the repository
  # owner supplying signing/notarization identities).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - name: Version consistency
        run: python scripts/check-version.py
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build frozen backend sidecar
        shell: bash
        run: bash scripts/build-sidecar.sh
      - name: cargo check (Tauri shell)
        working-directory: src-tauri
        run: cargo check --locked
