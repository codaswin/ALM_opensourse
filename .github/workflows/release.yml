name: release

# Builds Linux and Windows desktop packages and publishes them as a single
# GitHub Release whenever a "v*" tag is pushed. Uses the Actions-provided
# GITHUB_TOKEN — no personal access token or `gh` login is required to run
# this.
#
# This produces plain, unsigned installers (Linux: AppImage/.deb/.rpm;
# Windows: .msi/.exe). The Tauri auto-updater plugin is disabled in
# src-tauri/src/lib.rs (see that file for why), so there is no signed update
# manifest involved — this workflow only uploads the installers themselves,
# which is safe to do unsigned for a manual first-run install. See
# docs/releasing.md for what remains manual (code signing, notarization,
# macOS builds).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Full Rust release compile + Node + PyInstaller onefile sidecar +
      # AppImage/deb/rpm bundling is disk-heavy; ubuntu-latest ships ~20GB
      # of unrelated preinstalled SDKs (dotnet, Android, GHC, boost) that
      # eat into the runner's free space. Clear them before the real build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h /

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Version consistency
        run: python scripts/check-version.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build frozen backend sidecar
        run: bash scripts/build-sidecar.sh

      # Deliberately run from the repo root, not src-tauri/ — the Tauri
      # CLI resolves beforeBuildCommand's cwd differently depending on
      # where it's invoked from, and repo-root is the invocation this repo
      # actually tests (README's documented install steps, local dev). A
      # `working-directory: src-tauri` variant of this step looked for
      # frontend/package.json at the repo root instead and failed.
      - name: Build Tauri bundles (AppImage, deb, rpm)
        run: npx @tauri-apps/cli@2 build

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # windows-latest ships WebView2 and the MSVC toolchain already —
      # nothing Linux-equivalent to libwebkit2gtk is needed here.
      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Version consistency
        run: python scripts/check-version.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # scripts/build-sidecar.sh already branches on OS ("Windows_NT") to
      # append .exe and compute the right target-triple filename — it just
      # needs a bash to run in, which windows-latest provides via Git Bash.
      - name: Build frozen backend sidecar
        shell: bash
        run: bash scripts/build-sidecar.sh

      - name: Build Tauri bundles (msi, nsis)
        run: npx @tauri-apps/cli@2 build

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AI LinkedIn Manager ${{ github.ref_name }}
          body: |
            Unsigned desktop builds:
            - Linux — AppImage, .deb, and .rpm packages
            - Windows — .msi and setup .exe (NSIS) installers

            See the README for install instructions and what "unsigned" means
            in practice (Windows SmartScreen and Linux package managers will
            both warn about an unrecognized/unsigned publisher on first run —
            that's expected until this project has a signing identity).
          # actions/upload-artifact preserves the bundle/{appimage,deb,rpm,msi,nsis}
          # subdirectory structure, so after download-artifact the files are nested
          # (e.g. dist/linux-bundles/appimage/*.AppImage) — a flat dist/linux-bundles/*
          # glob matches nothing here, which is why the first run of this job
          # "succeeded" but silently attached zero assets to the release.
          files: |
            dist/linux-bundles/**/*.AppImage
            dist/linux-bundles/**/*.deb
            dist/linux-bundles/**/*.rpm
            dist/windows-bundles/**/*.msi
            dist/windows-bundles/**/*.exe
